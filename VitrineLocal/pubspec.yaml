name: vitrine
description: Catálogo, pedidos e análise de vendas para pequenos negócios, 100% offline.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  image_picker: ^1.2.4
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
